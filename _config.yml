# Site configuration
# 1. Files excluded from Jekyll builds
# 2. Installed Gems
# 3. Gem settings
# 4. Jekyll settings
# 5. Collections
# 6. Jekyll collections settings
# 7. Site settings

# 1. Files excluded from Jekyll builds
exclude:
- README.md
- CODE_OF_CONDUCT.md
- CONTRIBUTING.md
- screenshot.png
- LICENSE
- CNAME
- Gemfile
- Gemfile.lock
- garth-jekyll-theme.gemspec

# 2. Installed Gems
plugins:
- jekyll-paginate

# 3. Gem settings
paginate: 2 # jekyll-paginate > items per page
paginate_path: page:num # jekyll-paginate > blog page

# 4. Jekyll settings
sass:
 style: compressed # Style compression
permalink: pretty  # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more --> # Marks end of excerpt in posts
timezone:  # Timezone for blog posts and alike

# 5. Collections
collections:
  posts:
    title: Annan Kirk - Home # Needed for Siteleaf
    output: false
    description: "I'm a 4th year PhD student at Michigan State University researching linguistics. I'm a member of the MSU Sociolinguistics Lab and a research assistant for the MI Diaries project. I'm currently leading and developing MI Diaries's new Participant Engagement Team: designing ways to keep our project participants feeling like part of a community and telling quality stories. I earned an MA in Linguistics from Southern Illinois University, and I earned a BA in Liberal Studies (with concentrations in Linguistics, Spanish, and Psychology) from Stephen F. Austin State University." # The post list page content

# 6. Jekyll collections settings
defaults:
  -
    scope:
      path: ""
      type: pages
    values:
      layout: page # Default layout
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post # Default layout

# 7. Site settings
encoding: utf-8 # Make sure the encoding is right
title: "Annan Kirk" # Site name or title
logo: "assets/favicon.ico" # Site logo
#favicon: "assets/favicon.ico" # Uncomment to add custom favicon, or leave as is to use site logo
description: "Michigan State University" # Site description and default description
url: "https://annankirk.github.io" # Site url
baseurl: ""
lang: en-GB
